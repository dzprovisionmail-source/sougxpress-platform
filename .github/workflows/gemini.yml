name: Gemini Code Assistant

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Run Gemini Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, time
          from google import genai

          key = os.getenv('GEMINI_API_KEY')
          if not key:
              print('❌ خطأ: مفتاح GEMINI_API_KEY غير موجود في Secrets!')
              exit(1)

          client = genai.Client(api_key=key)

          # المحاولة حتى 3 مرات في حال وجود ضغط على الـ API
          for attempt in range(1, 4):
              try:
                  response = client.models.generate_content(
                      model='gemini-2.0-flash',
                      contents='قم بتقديم تحليل سريع وموجز لأهم ملفات هذا المستودع.'
                  )
                  print('=== نتيجة تحليل Gemini ===')
                  print(response.text)
                  break
              except Exception as e:
                  if '429' in str(e) or 'Quota' in str(e):
                      print(f'⚠️ تجاوز حد الطلبات، سأنتظر 10 ثوانٍ وأحاول مجدداً... (المحاولة {attempt}/3)')
                      time.sleep(10)
                  else:
                      raise e
          "
